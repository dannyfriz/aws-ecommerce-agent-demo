[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-ecommerce-identity-lab"
version = "0.1.0"
description = "Soporte posventa con identidad, autorización y aprobación humana en AWS"
requires-python = ">=3.14,<3.16"
dependencies = ["boto3==1.43.118"]

[tool.setuptools.packages.find]
where = ["src"]
