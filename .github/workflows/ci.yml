name: Validación sin despliegue
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: validacion-${{ github.ref }}
  cancel-in-progress: true
jobs:
  seguridad:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.9'
      - name: Instalar Trivy oficial y verificar SHA256
        run: python scripts/install_trivy.py
      - name: Analizar vulnerabilidades, Terraform y secretos
        run: python scripts/security_scan.py
  aplicacion:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.14.9', '3.15.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.1'
          package-manager-cache: false
      - name: Instalar dependencias verificadas
        run: |
          python -m pip install --upgrade pip==26.2.2
          python -m pip install --require-hashes -r requirements.lock
      - name: Usar npm estable vigente
        run: npm install --global npm@12.2.1
      - name: Verificar versiones vigentes y pins reales
        if: matrix.python == '3.14.9'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/audit_versions.py --output .build/version-audit.json
      - name: Pruebas de negocio, identidad y adaptadores
        env:
          PYTHONPATH: src
          AWS_EC2_METADATA_DISABLED: 'true'
        run: python -m unittest discover -s tests -v
      - name: Pruebas de autenticación del navegador
        run: |
          node tests/web-auth.test.mjs
          node tests/web-evidence.test.mjs
          node tests/web-order-sync.test.mjs
          node tests/web-profiles.test.mjs
          node tests/web-pending.test.mjs
          node tests/web-review.test.mjs
      - name: Comprobar artefactos y sintaxis
        run: python scripts/check_repository.py
      - name: Empaquetar Lambda ARM64
        run: python scripts/package.py
  terraform:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.17.0'
          terraform_wrapper: false
      - name: Formato Terraform
        run: terraform -chdir=infra fmt -check -recursive
      - name: Validar las cuatro raíces sin backend remoto
        shell: bash
        run: |
          set -euo pipefail
          for layer in bootstrap foundation data compute; do
            terraform -chdir=infra/$layer init -backend=false -input=false -lockfile=readonly
            terraform -chdir=infra/$layer validate -no-color
          done
      - name: Pruebas de infraestructura con proveedor simulado
        run: |
          terraform -chdir=infra/foundation test -no-color
          terraform -chdir=infra/data test -no-color
          terraform -chdir=infra/compute test -no-color
