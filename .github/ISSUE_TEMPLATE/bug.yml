name: Reportar un error
description: Problema reproducible con datos ficticios y sin secretos.
title: "[Error]: "
body:
  - type: markdown
    attributes:
      value: "Para vulnerabilidades o credenciales expuestas, usa el canal privado de SECURITY.md."
  - type: textarea
    id: problem
    attributes:
      label: Problema y resultado esperado
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir con datos ficticios
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Commit o versión y entorno
  - type: textarea
    id: evidence
    attributes:
      label: Evidencia sin tokens ni datos personales
